<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .hijos{
            width: 300px;
            border: 2px black solid;
            border-radius: 5px;
        }
        .padre{
            width: 100%;
            height: 600px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="padre">
        <div class="hijos">1</div>
        <div class="hijos">2</div>
        <div class="hijos">3</div>
        <div class="hijos">4</div>
        <div class="hijos">5</div>
        <div class="hijos">1</div>
        <div class="hijos">2</div>
        <div class="hijos">3</div>
        <div class="hijos">4</div>
        <div class="hijos">5</div>
    </div>
</body>
</html>
